server {
    listen 80;
    server_name localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 캐시 정책
    # 캐시 헤더가 없으면 브라우저가 Last-Modified로 캐시 기간을 임의 추정해,
    # 배포·환경변수 변경 후에도 이미 방문한 사용자가 옛 파일을 계속 쓴다.
    # - index.html / env-config.js: 배포나 컨테이너 재시작마다 바뀌므로 매번 서버에 확인한다.
    #   (no-cache = 캐시는 하되 쓰기 전에 ETag로 재검증. 안 바뀌었으면 304라 비용이 작다)
    # - /assets/*: Vite가 내용 해시를 파일명에 넣어 내용이 바뀌면 이름도 바뀌므로 오래 캐시한다.

    # 런타임 환경변수(docker-entrypoint.sh가 컨테이너 시작 시 생성)
    location = /env-config.js {
        add_header Cache-Control "no-cache" always;
    }

    # 해시가 붙은 빌드 산출물
    # always를 붙이지 않는다: 성공 응답에만 헤더를 달아, 배포 도중 잠깐 없는
    # 파일의 404가 1년간 캐시되는 일을 막는다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # React Router(SPA) 새로고침 처리를 위한 설정
        try_files $uri $uri/ /index.html;
    }

    # SPA 진입 문서. 위 location / 의 폴백도 여기로 들어온다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
